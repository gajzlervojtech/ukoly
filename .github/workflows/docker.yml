name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 1) Testy + Android aplikace (APK)
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testy serveru
        working-directory: server
        run: |
          npm ci
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web pro aplikaci
        working-directory: web
        env:
          VITE_BUILD: ${{ github.run_number }}
        run: |
          npm ci
          npx vite build --outDir dist --emptyOutDir
          npx cap sync android

      - name: Klíč k podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Chybí secret ANDROID_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ukoly.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ukoly.jks" >> "$GITHUB_ENV"

      - name: Sestavit APK
        working-directory: web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Připravit ke stažení
        run: |
          mkdir -p out
          cp web/android/app/build/outputs/apk/release/app-release.apk out/ukoly.apk
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}"}' > out/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/
          retention-days: 30

  # 2) Docker image pro NAS (APK je přibalené, stáhne se z /apk/ukoly.apk)
  image:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Název image (malými písmeny)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ukoly" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
